name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run tests
        run: python -m pytest tests

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check the source
        run: ruff check .

  typing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build and install the wheel
        run: |
          python -m pip install build mypy 'pyright[nodejs]' types-pyserial
          python -m build
          python -m pip install dist/*.whl

      - name: Type-check the library
        run: |
          mypy --strict azarashi/
          pyright

      - name: Copy the caller checks out of the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/asacaller"
          cp tests/typing/*.py "$RUNNER_TEMP/asacaller/"
          echo '{"typeCheckingMode": "strict"}' > "$RUNNER_TEMP/asacaller/pyrightconfig.json"

      - name: Type-check correct uses
        working-directory: ${{ runner.temp }}/asacaller
        run: |
          mypy --strict consumer.py
          pyright consumer.py

      - name: Type-check the hand-written wrong uses
        working-directory: ${{ runner.temp }}/asacaller
        run: |
          mypy --strict consumer_mistakes.py > out.txt 2>&1 || true
          cat out.txt
          grep -q 'Found 6 errors' out.txt
          pyright --outputjson consumer_mistakes.py > mistakes.json || true
          python -c "import json,sys; sys.exit(0 if json.load(open('mistakes.json'))['summary']['errorCount'] else 'pyright saw nothing wrong')"

      - name: Type-check a wrong use of every public function
        working-directory: ${{ runner.temp }}/asacaller
        run: |
          python generate_mistakes.py every_misuse.py
          mypy --strict every_misuse.py > every.txt 2>&1 || true
          python check_all_reported.py every_misuse.py every.txt
          pyright --outputjson every_misuse.py > every.json || true
          python check_all_reported.py every_misuse.py every.json
