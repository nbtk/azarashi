[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "B", "UP"]
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# the subpackage __init__.py files gather their modules into one namespace
"azarashi/qzss_dcr_lib/*/__init__.py" = ["F403"]
