[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["azarashi"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "B", "UP"]
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# the subpackage __init__.py files gather their modules into one namespace
"azarashi/*/__init__.py" = ["F403"]
# __init__.py gathers every earlier name from _legacy in one line, so that one line can go
"azarashi/__init__.py" = ["F403", "F405"]

[tool.coverage.run]
source = ["azarashi"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
